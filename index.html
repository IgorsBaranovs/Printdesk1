<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Print Manager</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
            --text-secondary: #aaaaaa;
            --border-color: #2a2a2a;
            --danger-color: #e53935;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        h1, h2, h3 {
            margin-bottom: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #252525;
            color: #fff;
            font-size: 15px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .time-inputs {
            display: flex;
            gap: 10px;
        }

        .time-inputs div {
            flex: 1;
        }

        button, .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .btn-danger {
            background-color: var(--danger-color);
        }

        .btn-secondary {
            background-color: #444;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 24px;
        }

        .empty-state-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            width: auto;
        }

        /* History item styling */
        .history-item {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .photo-preview {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- AUTH CARD -->
    <div id="auth-card" class="card">
        <h2>Авторизация</h2>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="auth-email" placeholder="email@example.com">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="auth-password">
        </div>
        <button id="btn-login" onclick="login()">Войти</button>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="app-content" style="display: none;">
        
        <!-- SUMMARY CARD -->
        <div class="card">
            <h2>Главная</h2>
            <div id="summary">Загрузка...</div>
        </div>

        <!-- CALCULATOR CARD -->
        <div class="card">
            <h2>Калькулятор печати</h2>
            
            <div class="form-group">
                <label>Название детали / заказа</label>
                <input type="text" id="print-name" placeholder="Например: Корпус">
            </div>

            <div class="form-group">
                <label>Катушка пластика</label>
                <select id="spool-select"></select>
            </div>

            <div class="form-group">
                <label>Вес детали (г)</label>
                <input type="number" id="print-weight" placeholder="100" oninput="calculateCost()">
            </div>

            <div class="form-group">
                <label>Время печати</label>
                <div class="time-inputs">
                    <div>
                        <input type="number" id="print-hours" placeholder="Часы" min="0" value="0">
                    </div>
                    <div>
                        <input type="number" id="print-minutes" placeholder="Минуты" min="0" max="59" value="0">
                    </div>
                </div>
            </div>

            <div style="margin: 16px 0; padding: 12px; background: #252525; border-radius: 8px;">
                <div>Себестоимость: <strong id="calc-cost">0.00 €</strong></div>
            </div>

            <button onclick="saveOrder()">Сохранить в историю</button>
        </div>

        <!-- HISTORY CARD -->
        <div class="card">
            <h2>История печати</h2>
            <div id="history-list">Загрузка...</div>
        </div>

        <!-- SPOOLS MANAGEMENT CARD -->
        <div class="card">
            <h2>Мои катушки</h2>
            <div class="form-group">
                <label>Название / Тип</label>
                <input type="text" id="spool-name" placeholder="PLA Black">
            </div>
            <div class="time-inputs">
                <div>
                    <label>Вес (г)</label>
                    <input type="number" id="spool-weight" placeholder="1000">
                </div>
                <div>
                    <label>Цена (€)</label>
                    <input type="number" id="spool-price" step="0.01" placeholder="20.00">
                </div>
            </div>
            <div class="form-group" style="margin-top: 10px;">
                <label>Цвет (для отображения)</label>
                <input type="color" id="spool-color" value="#00adb5">
            </div>
            <button onclick="addSpool()">Добавить катушку</button>
            <div id="spools-list" style="margin-top: 16px;"></div>
        </div>

        <button class="btn-secondary" onclick="logout()" style="margin-top: 20px;">Выйти</button>
    </div>

    <!-- MODAL: DETAILS HISTORY CARD -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Детали заказа</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body">
                <!-- Заполняется динамически -->
            </div>
        </div>
    </div>

    <script>
        // Инициализация Supabase (замените на свои ключи)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let spools = [];
        let history = [];

        // Вспомогательные функции
        function esc(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatPrintTime(hours, minutes) {
            const h = parseInt(hours) || 0;
            const m = parseInt(minutes) || 0;
            if (h === 0 && m === 0) return 'Не указано';
            
            let result = '';
            if (h > 0) result += `${h} ч `;
            if (m > 0) result += `${m} мин`;
            return result.trim();
        }

        // Авторизация
        async function login() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                alert('Ошибка входа: ' + error.message);
            } else {
                currentUser = data.user;
                initApp();
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        // Проверка сессии
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                currentUser = session.user;
                initApp();
            }
        });

        async function initApp() {
            document.getElementById('auth-card').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            await loadData();
        }

        // Загрузка данных
        async function loadData() {
            // Загрузка катушек
            const { data: spoolsData } = await supabase
                .from('spools')
                .select('*')
                .eq('user_id', currentUser.id);
            spools = spoolsData || [];

            // Загрузка истории
            const { data: historyData } = await supabase
                .from('print_history')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });
            history = historyData || [];

            updateUI();
        }

        // Расчет стоимости
        function calculateCost() {
            const spoolId = document.getElementById('spool-select').value;
            const weight = parseFloat(document.getElementById('print-weight').value) || 0;
            
            const spool = spools.find(s => s.id == spoolId);
            if (!spool || !spool.weight || !spool.price) {
                document.getElementById('calc-cost').innerText = '0.00 €';
                return 0;
            }

            const pricePerGram = spool.price / spool.initial_weight; // Расчет от изначального веса
            const cost = weight * pricePerGram;
            
            document.getElementById('calc-cost').innerText = cost.toFixed(2) + ' €';
            return cost;
        }

        // Обновление UI
        function updateUI() {
            updateSummary();
            updateSpoolsList();
            updateHistoryList();
            updateSpoolSelect();
        }

        /* 1. Главная (Summary) */
        function updateSummary() {
            const summary = document.getElementById('summary');
            if (!spools.length) {
                summary.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🧵</div>
                        У вас пока нет активных катушек.
                    </div>`;
            } else {
                summary.innerHTML = spools.map(s => `
                    <div style="padding:8px 0; border-bottom:1px solid var(--border-color); display:flex; align-items:center; justify-content:space-between;">
                        <div>
                            <span class="color-dot" style="background:${esc(s.color || '#888888')}"></span>
                            <b>${esc(s.name)}</b>
                        </div>
                        <span style="color:#aaa; font-size:14px;">
                            ${s.weight} г
                        </span>
                    </div>
                `).join('');
            }
        }

        /* 2. Катушки */
        function updateSpoolSelect() {
            const select = document.getElementById('spool-select');
            select.innerHTML = spools.map(s => `
                <option value="${s.id}">${esc(s.name)} (Остаток: ${s.weight}г)</option>
            `).join('');
            calculateCost();
        }

        async function addSpool() {
            const name = document.getElementById('spool-name').value;
            const weight = parseFloat(document.getElementById('spool-weight').value);
            const price = parseFloat(document.getElementById('spool-price').value);
            const color = document.getElementById('spool-color').value;

            if (!name || !weight || !price) return alert('Заполните все поля');

            await supabase.from('spools').insert([{
                user_id: currentUser.id,
                name,
                weight,
                initial_weight: weight,
                price,
                color
            }]);

            document.getElementById('spool-name').value = '';
            document.getElementById('spool-weight').value = '';
            document.getElementById('spool-price').value = '';
            loadData();
        }

        function updateSpoolsList() {
            const list = document.getElementById('spools-list');
            list.innerHTML = spools.map(s => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #2a2a2a;">
                    <div>
                        <span class="color-dot" style="background:${s.color}"></span>
                        ${esc(s.name)} - ${s.weight}г (${s.price}€)
                    </div>
                    <button class="btn-danger" style="width:auto; padding:4px 8px;" onclick="deleteSpool('${s.id}')">✕</button>
                </div>
            `).join('');
        }

        async function deleteSpool(id) {
            if (confirm('Удалить катушку?')) {
                await supabase.from('spools').delete().eq('id', id);
                loadData();
            }
        }

        /* 3. Сохранение истории */
        async function saveOrder() {
            const name = document.getElementById('print-name').value;
            const spoolId = document.getElementById('spool-select').value;
            const weight = parseFloat(document.getElementById('print-weight').value) || 0;
            const hours = parseInt(document.getElementById('print-hours').value) || 0;
            const minutes = parseInt(document.getElementById('print-minutes').value) || 0;
            const cost = calculateCost();

            if (!name || !spoolId || weight <= 0) return alert('Заполните корректно название и вес!');

            const spool = spools.find(s => s.id == spoolId);

            // Сохраняем историю
            const { data, error } = await supabase.from('print_history').insert([{
                user_id: currentUser.id,
                name,
                spool_name: spool ? spool.name : 'Неизвестно',
                weight,
                cost,
                print_hours: hours,
                print_minutes: minutes,
                date: new Date().toLocaleDateString('ru-RU')
            }]).select();

            if (error) return alert('Ошибка сохранения: ' + error.message);

            // Списываем вес с катушки
            if (spool) {
                const newWeight = Math.max(0, spool.weight - weight);
                await supabase.from('spools').update({ weight: newWeight }).eq('id', spool.id);
            }

            // Очистка полей
            document.getElementById('print-name').value = '';
            document.getElementById('print-weight').value = '';
            document.getElementById('print-hours').value = '0';
            document.getElementById('print-minutes').value = '0';

            loadData();
        }

        /* 4. Список истории */
        function updateHistoryList() {
            const list = document.getElementById('history-list');
            if (!history.length) {
                list.innerHTML = '<div class="empty-state">История печати пуста</div>';
                return;
            }

            list.innerHTML = history.map(h => `
                <div class="history-item" onclick="openHistoryModal('${h.id}')">
                    <div>
                        <b>${esc(h.name)}</b>
                        <div style="font-size:12px; color:var(--text-secondary);">${h.date}</div>
                    </div>
                    <div style="text-align:right;">
                        <div><b>${h.cost.toFixed(2)} €</b></div>
                        <div style="font-size:12px; color:var(--text-secondary);">${h.weight}г</div>
                    </div>
                </div>
            `).join('');
        }

        /* 5. Карточка истории (Модальное окно с ВРЕМЕНЕМ) */
        function openHistoryModal(id) {
            const item = history.find(h => h.id == id);
            if (!item) return;

            const modalBody = document.getElementById('modal-body');
            const printTimeFormatted = formatPrintTime(item.print_hours, item.print_minutes);

            modalBody.innerHTML = `
                <p><strong>Дата:</strong> ${item.date}</p>
                <p><strong>Катушка:</strong> ${esc(item.spool_name)}</p>
                <p><strong>Расход пластика:</strong> ${item.weight} г</p>
                <p><strong>Себестоимость:</strong> ${item.cost.toFixed(2)} €</p>
                <p style="margin-top: 8px; font-size: 16px;">
                    <strong>⏱ Время печати:</strong> 
                    <span style="color: var(--accent-color); font-weight: bold;">${printTimeFormatted}</span>
                </p>

                ${item.photo_url ? `<img src="${item.photo_url}" class="photo-preview">` : ''}

                <div style="margin-top: 20px;">
                    <button class="btn-danger" onclick="deleteHistoryItem('${item.id}')">Удалить из истории</button>
                </div>
            `;

            document.getElementById('history-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('history-modal').classList.remove('active');
        }

        async function deleteHistoryItem(id) {
            if (confirm('Удалить эту запись из истории?')) {
                await supabase.from('print_history').delete().eq('id', id);
                closeModal();
                loadData();
            }
        }
    </script>
</body>
</html>
